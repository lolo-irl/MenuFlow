<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Acesso Administrativo - MenuFlow</title>
        <meta
            name="description"
            content="Acesso restrito para administração do cardápio e gerenciamento de pedidos MenuFlow."
        />

        <!-- Folha de estilos local do Bootstrap 5.3 -->
        <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
        <!-- Tema oficial MenuFlow em styles/styles.css (carregado após o Bootstrap) -->
        <link rel="stylesheet" href="../../styles/styles.css" />
    </head>
    <body class="min-vh-100 d-flex flex-column">
        <!-- HEADER SIMPLIFICADO -->
        <header class="bg-white border-bottom py-3">
            <div class="container-xl d-flex align-items-center justify-content-between">
                <a
                    class="navbar-brand d-flex align-items-center gap-2 text-decoration-none"
                    href="../../index.html"
                >
                    <div
                        class="d-flex align-items-center justify-content-center bg-primary rounded-3 text-white"
                        style="width: 36px; height: 36px"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path d="M18 2v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V2"></path>
                            <path d="M12 11v11"></path>
                            <path d="M6 14h12"></path>
                        </svg>
                    </div>
                    <div class="d-flex flex-column">
                        <span class="fs-5 fw-bold text-dark lh-1">MenuFlow</span>
                        <small class="text-secondary small" style="font-size: 0.7rem"
                            >Painel Administrativo</small
                        >
                    </div>
                </a>
                <a
                    href="../client/cardapio.html"
                    class="btn btn-outline-secondary btn-sm rounded-3"
                >
                    ← Ir para o Cardápio
                </a>
            </div>
        </header>

        <!-- MAIN CONTENT: FORMULÁRIO DE LOGIN -->
        <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
            <div class="container-xl" style="max-width: 440px">
                <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
                    <!-- Cabeçalho -->
                    <div class="text-center mb-4">
                        <div
                            class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-3"
                            style="width: 60px; height: 60px"
                        >
                            <svg
                                width="28"
                                height="28"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h1 class="h4 fw-bold text-dark mb-1">Área Administrativa</h1>
                        <p class="text-secondary small mb-0">
                            Gerenciamento de produtos e acompanhamento de pedidos.
                        </p>
                    </div>

                    <!-- Formulário com Label For -->
                    <form id="form-admin-login" action="dashboard.html" method="get">
                        <div class="mb-3">
                            <label for="admin-email" class="form-label small fw-bold text-dark"
                                >E-mail de Acesso:</label
                            >
                            <input
                                type="email"
                                class="form-control"
                                id="admin-email"
                                placeholder="admin@menuflow.com"
                                value="admin@menuflow.com"
                                required
                            />
                        </div>

                        <div class="mb-4">
                            <label for="admin-senha" class="form-label small fw-bold text-dark"
                                >Senha:</label
                            >
                            <input
                                type="password"
                                class="form-control"
                                id="admin-senha"
                                placeholder="••••••••"
                                value="admin123"
                                required
                            />
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2"
                        >
                            <span>Entrar no Painel</span>
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-secondary">
                            Credenciais demonstrativas: <code>admin@menuflow.com</code> /
                            <code>admin123</code>
                        </small>
                    </div>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="mt-auto bg-white border-top py-3">
            <div class="container-xl text-center">
                <small class="text-secondary">© 2026 MenuFlow — Painel Administrativo.</small>
            </div>
        </footer>

        <!-- Script local do Bootstrap 5.3 -->
        <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
